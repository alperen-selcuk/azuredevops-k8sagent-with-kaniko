apiVersion: apps/v1
kind: Deployment
metadata:
  name: azagent
  namespace: azagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azagent
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: azagent
    spec:
      serviceAccountName: azagent
      automountServiceAccountToken: true
      # give start.sh time to unregister the agent from Azure DevOps
      terminationGracePeriodSeconds: 120
      containers:
      - name: azagent-container
        image: hasanalperen/azkubernetesagent # pin a tag in production
        imagePullPolicy: Always
        env:
        - name: AGENT_ALLOW_RUNASROOT
          value: "true"
        - name: AZP_WORK
          value: /azp/_work
        envFrom:
        - secretRef:
            name: azdevops
        # kaniko builds run in userspace and need root, but not privileged mode
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - name: work
          mountPath: /azp/_work
      volumes:
      - name: work
        emptyDir: {}
